# Emergency Response Intelligence Platform — Phase 0–4 stack.
#
# db (PostGIS): the API bootstraps the schema and seeds it on startup.
# valhalla:     travel-time routing/isochrone engine over OpenStreetMap.
#               Routing degrades to a straight-line estimate if it is absent.

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: erip-db
    environment:
      POSTGRES_USER: erip
      POSTGRES_PASSWORD: erip
      POSTGRES_DB: erip
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erip"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Valhalla routing engine. On first run it downloads the OSM extract named
  # below and builds routing tiles into the named volume (this takes a while);
  # subsequent starts reuse the tiles. Swap the URL for your region's extract.
  valhalla:
    image: ghcr.io/gis-ops/docker-valhalla/valhalla:latest
    container_name: erip-valhalla
    ports:
      - "8002:8002"
    environment:
      tile_urls: https://download.geofabrik.de/north-america/us/california/norcal-latest.osm.pbf
      server_threads: 2
      use_tiles_ignore_pbf: "True"
      build_elevation: "False"
      build_admins: "True"
      build_time_zones: "False"
    volumes:
      - valhalla_tiles:/custom_files

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: erip-api
    environment:
      PORT: 3000
      DATABASE_URL: postgres://erip:erip@db:5432/erip
      CORS_ORIGIN: http://localhost:8080
      VALHALLA_URL: http://valhalla:8002
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: erip-web
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  pgdata:
  valhalla_tiles:
