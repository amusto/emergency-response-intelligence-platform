# Emergency Response Intelligence Platform — Phase 0–3 stack.
#
# The database runs PostGIS. The API bootstraps the schema and seeds the
# tables on startup, then serves all entity and proximity queries from it.

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: erip-db
    environment:
      POSTGRES_USER: erip
      POSTGRES_PASSWORD: erip
      POSTGRES_DB: erip
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erip"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: erip-api
    environment:
      PORT: 3000
      DATABASE_URL: postgres://erip:erip@db:5432/erip
      CORS_ORIGIN: http://localhost:8080
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: erip-web
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  pgdata:
